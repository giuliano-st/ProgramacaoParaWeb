<!DOCTYPE html>
<head>
    <meta charset="UTF-8" , lang="pt-br" , content="width=device-width, initial-scale=1.0">
    <title>Currículo</title>
    <link rel="stylesheet" href="curriculo.css">
    <link id="theme" rel="stylesheet" href="estilo-light.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"></head>
<body>
<div class="topo">
    <button onclick="changeStyle('estilo-light.css')">🌞</button>
    <button onclick="changeStyle('estilo-dark.css')">🌙</button>
</div>

<div class="formulario">
    <h3 style="padding-bottom: 10px">Formulário de Contato</h3>
    <form id="meuFormulario">
        <p id="erroMensagem" style="color: red; display: none;">A mensagem deve ter pelo menos 10 caracteres.</p>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        <p id="erroEmail" style="color: red; display: none;">E-mail deve conter o arroba @.</p>
        <input type="email" id="email" name="email" placeholder="Digite seu email">

        <label for="ass">Assunto</label>
        <select id="ass" name="ass">
            <option>Opinião</option>
            <option>Mensagem</option>
            <option>Comentário</option>
        </select>

        <label for="comentario">Comentários:</label>
        <textarea id="comentario" name="comentario" placeholder="Insira seu comentário"></textarea>

        <input type="text" id="pesquisa" placeholder="Pesquisar...">

        <input type="submit" value="Enviar">
    </form>
</div>
<div>
    <a class="home" href="index.html"><img src="home.png">
</div>
<script src="script.js"></script>
</body>
<footer>
    <div class="fundo">
        <ul class="social">
            <li><a href="http://github.com/"><img src="github.png"></a></li>
            <li><a href="https://www.facebook.com/"><img src="facebook.png"></a></li>
            <li><a href="https://www.reddit.com/"><img src="reddit.png"></a></li>
        </ul>
    </div>
</footer>
